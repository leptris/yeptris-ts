name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The engine source the wasm is built from. PINNED (the pin law: a
  # moving ref: main would silently pick up engine breakage mid-wave).
  # Pinned to an engine main SHA here, not a release tag, on purpose:
  # the validate face's stream attribution (#885 items 4+5 — a
  # multi-document stream's diagnostic paths carry the document index,
  # "/1/a" is a of document 1) is committed on engine main but not yet
  # in a release tag; the v0.6.59 tag builds this package fine except
  # for that piece. Re-point at the next release tag when the engine
  # train cuts.
  ENGINE_REF: 1f123a4921aad7e4d9a03a5d2e9a8a5f2d3d364c

jobs:
  test:
    name: wasm build + node test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout engine repository
        uses: actions/checkout@v4
        with:
          repository: leptris/yeptris
          ref: ${{ env.ENGINE_REF }}
          path: engine
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.50"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build (zero-warning gate)
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log
          # The wasm32 build is the only lane that compiles the engine with
          # 32-bit size_t/uintptr_t — warnings there are real portability
          # bugs (truncated 64-bit constants, UB shifts), not noise.
          ! grep -q "warning:" build.log || {
            echo "::error::emcc emitted warnings — wasm32 portability class"
            exit 1
          }
        env:
          ENGINESRC: ${{ github.workspace }}/engine/src
      - name: node --test
        run: node --test test/test.mjs
