name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The engine source the wasm is built from. PINNED to a release tag:
  # a bad engine main must not break builds (the pin law). BUMP WITH
  # EACH ENGINE WAVE: every engine release train re-points this at the
  # new tag; an unpinned ref: main silently picks up engine breakage
  # mid-wave.
  ENGINE_REF: refs/tags/v0.6.57

jobs:
  test:
    name: wasm build + node test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout engine repository
        uses: actions/checkout@v4
        with:
          repository: leptris/yeptris
          ref: ${{ env.ENGINE_REF }}
          path: engine
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.50"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build (zero-warning gate)
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log
          # The wasm32 build is the only lane that compiles the engine with
          # 32-bit size_t/uintptr_t — warnings there are real portability
          # bugs (truncated 64-bit constants, UB shifts), not noise.
          ! grep -q "warning:" build.log || {
            echo "::error::emcc emitted warnings — wasm32 portability class"
            exit 1
          }
        env:
          ENGINESRC: ${{ github.workspace }}/engine/src
      - name: node --test
        run: node --test test/test.mjs
