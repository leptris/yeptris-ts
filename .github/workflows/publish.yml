# Publish train for yeptris (npm Trusted Publishing, OIDC).
#
# Versions are the owner's decision: bump package.json through a
# merged PR, then dispatch. The first publish is manual (configure
# leptris/yeptris-ts + release.yml as the package's publisher on
# npmjs afterwards); subsequent dispatches publish via OIDC.

name: Release

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:

env:
  # The engine source the wasm is built from. PINNED to a release tag:
  # a bad engine main must not break a publish (the pin law). BUMP
  # WITH EACH ENGINE WAVE: every engine release train re-points this
  # at the new tag BEFORE dispatching this workflow.
  ENGINE_REF: refs/tags/v0.6.58

jobs:
  publish:
    name: build + npm publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout engine repository
        uses: actions/checkout@v4
        with:
          repository: leptris/yeptris
          ref: ${{ env.ENGINE_REF }}
          path: engine
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.50"
      - uses: actions/setup-node@v4
        with:
          # npm >= 11.5.1 is REQUIRED for Trusted Publishing (OIDC);
          # node 20's npm 10 predates it and the PUT 404s
          node-version: 24
        # no registry-url: an .npmrc authToken line makes npm ignore
        # the OIDC exchange entirely; with none, npm 11+ publishes via
        # the workflow's id-token against the registered TP
      - name: Build the wasm module
        run: ./build.sh
        env:
          ENGINESRC: ${{ github.workspace }}/engine/src
      - name: node --test
        run: node --test test/test.mjs
      - name: Publish (npm Trusted Publishing, OIDC)
        # id-token: write above hands npm the OIDC token; npm uses it
        # to authenticate against the Trusted Publisher configured on
        # npmjs.com for this workflow. Configure the TP entry
        # (org: leptris, repo: yeptris-ts, workflow filename: THIS FILE —
        # publish.yml, not release.yml) before the first OIDC dispatch.
        run: npm publish
      - name: Version
        run: |
          V=$(node -p 'require("./package.json").version')
          echo "V=$V" >> "$GITHUB_ENV"
          echo "releasing v$V"

      - name: Tag and release
        run: gh release create "v$V" dist/yeptris.mjs dist/yeptris.wasm --generate-notes --title "yeptris v$V"
        env:
          GH_TOKEN: ${{ github.token }}
